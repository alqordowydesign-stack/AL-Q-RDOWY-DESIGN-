<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080c"><title>Admin — AL-QÔRDOWY DESIGN</title><style>body{margin:0;background:#07080c;color:#fff;font-family:Arial;padding:30px}main{max-width:800px;margin:auto}h1{color:#e2b34e}.box{background:#101116;border:1px solid #ffffff18;border-radius:15px;padding:22px;margin:18px 0}input,textarea,select,button{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #ffffff22;background:#08090d;color:#fff;box-sizing:border-box}button{background:#e2b34e;color:#08090d;font-weight:900;cursor:pointer}.item{display:flex;gap:12px;align-items:center;border-top:1px solid #ffffff12;padding:12px 0}.item img{width:90px;height:70px;object-fit:cover;border-radius:8px}.danger{background:#8d3030;color:#fff}.hidden{display:none}.msg{color:#f0c96e}</style></head><body><main><h1>AL-QÔRDOWY DESIGN — ADMIN</h1><p>Seul l'administrateur doit utiliser cette page.</p><div id="login" class="box"><h2>Connexion</h2><input id="pass" type="password" placeholder="Mot de passe administrateur"><button onclick="login()">Se connecter</button><div id="loginMsg" class="msg"></div></div><div id="panel" class="hidden"><div class="box"><h2>Ajouter une création</h2><form id="form"><input name="image" type="file" accept="image/*" required><input name="title" placeholder="Titre de la création"><select name="category"><option>Affiche</option><option>Flyer</option><option>Logo</option><option>Vidéo</option><option>Autre</option></select><textarea name="description" placeholder="Description (facultatif)"></textarea><button>Publier sur le site</button></form><div id="msg" class="msg"></div></div><div class="box"><h2>Mes créations</h2><div id="list"></div></div></div></main><script>
let token="";
async function login(){let p=document.getElementById('pass').value;let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});let d=await r.json();if(!r.ok){loginMsg.textContent=d.error;return}token=d.token;login.classList.add('hidden');panel.classList.remove('hidden');load()}
async function load(){let r=await fetch('/api/gallery');let a=await r.json();list.innerHTML=a.length?a.map(x=>`<div class="item"><img src="/uploads/${encodeURIComponent(x.filename)}"><div style="flex:1"><b>${esc(x.title||'Sans titre')}</b><br><small>${esc(x.category||'')}</small></div><button class="danger" style="width:auto" onclick="del('${x.id}')">Supprimer</button></div>`).join(''):'Aucune création.'}
form.onsubmit=async e=>{e.preventDefault();let fd=new FormData(form);let r=await fetch('/api/admin/upload',{method:'POST',headers:{'x-admin-token':token},body:fd});let d=await r.json();msg.textContent=r.ok?'Création publiée !':d.error;if(r.ok){form.reset();load()}}
async function del(id){if(!confirm('Supprimer cette création ?'))return;let r=await fetch('/api/admin/gallery/'+id,{method:'DELETE',headers:{'x-admin-token':token}});if(r.ok)load()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
